<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT PWA B01 양식 3종 HTTPS 시험 V1</title><style>body{font:16px/1.55 system-ui,sans-serif;max-width:720px;margin:auto;padding:16px}button,input,textarea,select{font:inherit;padding:10px;border:1px solid #888;border-radius:8px;box-sizing:border-box}button{margin:4px;background:#edf3ff}input,textarea,select{width:100%}textarea{min-height:70px}label{display:block;margin:12px 0;font-weight:600}#out{min-height:260px;font:14px/1.5 monospace}#status{font-weight:bold}</style></head><body><h2>PROJECT PWA — B01 공식 양식 3종 V1</h2><p>HTTPS 실기기 시험 전용. 실제 전송·Library 등록·승인이 아닙니다.</p><div><button onclick="show(0)">공용 인계문 ①~⑨</button><button onclick="show(1)">간략보고 ①~⑤</button><button onclick="show(2)">선택·승인</button></div><section id="fields"></section><div><button onclick="generate()">문서 생성</button><button onclick="copy()">복사 시도</button><button onclick="manual()">전체 선택(수동 복사)</button></div><label>생성된 문서<textarea id="out" spellcheck="false"></textarea></label><p id="status" role="status" aria-live="polite">시험 전</p><p><a href="./">기존 복사 시험 화면</a></p><script>
const titles=[['인계서 ID','작업 ID','발신방','허용 수신방','승인 상태','② 인계 이유·작업 흐름','③ 실행 지시·조건','④ 작업 결과','⑤ 생성파일·원장·공유폴더','⑥ 백업·복원','⑦ 검증·인수·승인','⑧ 후속 인계','⑨ 결과물·SHARED_INBOX 등록'],['① 작업결과','② 다음작업','③ 문제점','④ 미처리현황','⑤ 공용폴더 등록현황'],['요청 ID','실행범위','선택','종합 의견','최종 실행승인']];let mode=0;function show(m){mode=m;document.getElementById('fields').innerHTML='<h3>'+['방 간 공용 인계문','사용자용 간략보고','선택·승인 양식'][m]+'</h3>'+titles[m].map((t,i)=>'<label>'+t+(m===2&&i===2?'<select id="f'+i+'"><option>미접수</option><option>① 실행 승인</option><option>② 보완 요청</option><option>③ 보류</option></select>':m===2&&i===4?'<select id="f'+i+'"><option>미승인</option><option>시험용 승인 선택</option><option>보완 요청</option><option>보류</option></select>':'<textarea id="f'+i+'"></textarea>')+'</label>').join('');if(m===0){document.getElementById('f0').value='TEST-B01-V1';document.getElementById('f1').value='B01';document.getElementById('f2').value='0. 총괄·중앙자동화(Chat·임시)';document.getElementById('f3').value='2. 독립검증(Chat)'}if(m===2)document.getElementById('f0').value='TEST-B01-APPROVAL-V1';document.getElementById('status').textContent='양식 선택 완료'}function generate(){let a=titles[mode].map((t,i)=>(mode===0&&i===0?'① 인계 식별 및 실행권한 — ':'')+t+': '+(document.getElementById('f'+i).value.trim()||'미확인'));let h=['PROJECT PWA — 방 간 공용 인계문 V1','PROJECT PWA — 사용자용 간략보고 V1','PROJECT PWA — 선택·승인 양식 V1'][mode];document.getElementById('out').value=h+'\n\n'+a.join('\n')+(mode===2?'\n주의: 이 문서는 실제 대화 승인·실행을 대신하지 않음':'');document.getElementById('status').textContent='문서 생성 완료 (시험용)'}function manual(){let e=document.getElementById('out');e.focus();e.select();e.setSelectionRange(0,e.value.length);document.getElementById('status').textContent='전체 선택됨. 길게 눌러 복사하세요.'}async function copy(){try{if(!window.isSecureContext||!navigator.clipboard)throw Error('보안 컨텍스트 또는 Clipboard API 없음');await navigator.clipboard.writeText(document.getElementById('out').value);document.getElementById('status').textContent='자동 복사 성공 (실제 방 전달 아님)'}catch(e){manual();document.getElementById('status').textContent='자동 복사 실패: '+e.message+'. 수동 복사하세요.'}}show(0);
</script></body></html>
