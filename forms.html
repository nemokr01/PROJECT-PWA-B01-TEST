<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT PWA B01 공식 양식 3종 V1 — 수정 모의시험</title><style>body{font:16px/1.55 system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f6f7f9;color:#17212b}h1{font-size:1.35rem}nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;padding:11px;border:1px solid #9ca3af;border-radius:10px;background:white;cursor:pointer}button[aria-selected=true]{background:#193b70;color:white}section{background:white;padding:16px;margin-top:12px;border-radius:12px}label{display:block;margin:10px 0 4px;font-weight:600}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #aaa;border-radius:8px}textarea{min-height:76px}#output{min-height:240px;font:13px/1.5 monospace}small{color:#555}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:#e8f0ff}#status{font-weight:bold;white-space:pre-wrap} .hidden{display:none}.meta{background:#f0f4fa;padding:10px;border-radius:8px;margin:8px 0}.pill{border-radius:99px;min-width:44px;min-height:44px;padding:8px}.green{background:#137b4b;color:white}.red{background:#b42318;color:white}.details{background:#eee;padding:8px;margin:4px 0 8px;border-radius:7px}.status-row{margin:6px 0}#reportPreview{border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:12px}#reportPreview hr{border:0;border-top:1px solid #ddd}.note{color:#555;font-size:.88rem}</style></head><body><h1>PROJECT PWA · B01 공식 양식 3종 V1</h1><small>로컬 모의시험 · 전송·Library 저장·실행승인 기능 없음</small><nav aria-label="양식 선택"><button data-tab="handoff" aria-selected="true">①~⑨ 인계문</button><button data-tab="report" aria-selected="false">①~⑤ 간략보고</button><button data-tab="approval" aria-selected="false">선택·승인</button></nav><section><div id="handoff"><label>공용 인계서 ID<input id="hid" placeholder="PROJECT-PWA-...-V1"></label><label>작업 ID<input id="task" value="B01"></label><label>발신방<input id="sender" value="0. 총괄·중앙자동화(Chat·임시)"></label><label>허용 수신방<input id="receiver" value="2. 독립검증(Chat)"></label><label>승인 ID·범위<textarea id="permission"></textarea></label><label>수신방별 허용 업무<input id="allowed" placeholder="예: B01 차분 독립검증"></label><label>발행 시각·유효기간<input id="validity" placeholder="미확인"></label><label>대상 버전<input id="version" value="V1"></label><label>중복 조회·기존 결과<textarea id="dedupe"></textarea></label><label>선행조건·입력 ZIP·파일 ID·SHA-256<textarea id="prereq"></textarea></label><label>단계별 지시·금지사항<textarea id="steps"></textarea></label><label>수행 이력·영수증<textarea id="history"></textarea></label><label>소스·원장 버전·생성파일 목록<textarea id="inventory"></textarea></label><label>인계 목적·작업 순서<textarea id="purpose"></textarea></label><label>결과·Evidence·Manifest·SHA-256<textarea id="evidence"></textarea></label><label>SHARED_INBOX 등록·재조회 증빙<textarea id="receipt"></textarea></label><label>백업·복원 상태<textarea id="backup" placeholder="미실시 / 미확인 등"></textarea></label><label>검증·인수·승인 판정<textarea id="verify"></textarea></label><label>후속 인계<textarea id="next"></textarea></label></div><div id="report" class="hidden"><label>① 작업결과<textarea id="result"></textarea></label><label>② 다음작업<textarea id="nextwork"></textarea></label><label>③ 문제점<textarea id="problem"></textarea></label><label>④ 미처리현황<textarea id="pending" placeholder="즉시작업=초록 / 파일 미수신 확인=빨강 / 미확인=표시 없음"></textarea></label><label>⑤ 공용폴더 등록현황<textarea id="storage" placeholder="실제 결과파일·등록상태를 요약"></textarea></label><label>④·⑤ 상태 데이터 JSON<textarea id="roomjson" placeholder='{"pending":[{"room":"2","state":"green","detail":"즉시 작업 확인"}],"storage":[{"room":"0","created":true,"files":[{"name":"RESULT.zip","registered":true,"readback":true}],"detail":"등록 재조회 확인"}]}'></textarea></label><div class="note">실제 증거가 없는 방은 원을 표시하지 않습니다. 상태 데이터는 모의 입력이며 실제 등록증이 아닙니다.</div><div id="reportPreview" aria-label="간략보고 미리보기"></div></div><div id="approval" class="hidden"><label>요청 ID<input id="requestid"></label><label>목적·범위<textarea id="scope"></textarea></label><label>선택 항목 1 (최대 3문항)<select id="choice"><option value="">선택하지 않음</option><option>① 단계별 진행</option><option>② 허용 범위 내 일괄 진행</option><option>③ 보류</option></select></label><label>선택 문항 2<select id="choice2"><option value="">미선택</option><option>① 단계별 진행</option><option>② 허용 범위 내 일괄 진행</option><option>③ 보류</option></select></label><label>선택 문항 3<select id="choice3"><option value="">미선택</option><option>① 단계별 진행</option><option>② 허용 범위 내 일괄 진행</option><option>③ 보류</option></select></label><label>선택 목적·추천안·대안·장단점<textarea id="alternatives"></textarea></label><label>제외범위·선행조건<textarea id="excluded"></textarea></label><label>비용·보안·복구 영향<textarea id="risk"></textarea></label><label>원본 식별·해시·유효기간<textarea id="approvalEvidence"></textarea></label><label>종합 추가 의견<textarea id="opinion"></textarea></label><label>최종 실행승인 (선택 제출과 별개)<select id="decision"><option value="">미승인</option><option>① 실행 승인 요청 (실제 승인 아님)</option><option>② 보완 요청</option><option>③ 보류</option></select></label><small>선택 제출 ≠ 실행 승인. 최종 ① 실행 승인 ② 보완 요청 ③ 보류는 실제 대화에서 별도로 접수해야 합니다. 이 페이지의 선택은 실제 대화 승인·실행을 발생시키지 않습니다.</small></div><div class="actions"><button id="generate">문서 생성</button><button id="copy">복사 시도</button><button id="select">수동 복사용 전체 선택</button></div><label for="output">생성 문서</label><textarea id="output" readonly></textarea><p id="status" role="status" aria-live="polite"></p></section><script>
const $=id=>document.getElementById(id),v=id=>$(id).value.trim(),safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='handoff';
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));['handoff','report','approval'].forEach(x=>$(x).classList.toggle('hidden',x!==tab));$('status').textContent='';}));
const t=id=>v(id)||'미확인';
function build(){
 if(tab==='handoff'){
 if(!v('hid')||!v('receiver')||!v('allowed'))throw Error('인계서 ID·허용 수신방·허용 업무를 입력하세요.');
 return ['PROJECT PWA — 방 간 공용 인계문 V1',
 '① 인계 식별 및 실행권한\n인계서 ID: '+v('hid')+'\n작업 ID: '+t('task')+' / 대상 버전: '+t('version')+'\n발신방: '+t('sender')+'\n허용 수신방: '+v('receiver')+'\n허용 업무: '+t('allowed')+'\n발행·유효기간: '+t('validity')+'\n승인 ID·범위·상태: '+t('permission')+'\n실행 제한: 지정 수신방만 허용된 업무 수행; 권한·승인·무결성 미충족 시 HOLD',
 '② 인계 이유 및 작업 흐름\n목적·흐름: '+t('purpose')+'\n중복 조회·기존 결과: '+t('dedupe'),
 '③ 실제 작업 지시 및 수행조건\n입력·선행관문: '+t('prereq')+'\n단계별 지시·금지: '+t('steps'),
 '④ 작업 수행 이력 및 결과\n수행 이력·영수증: '+t('history')+'\n결과·Evidence: '+t('evidence'),
 '⑤ 모든 생성파일·작업원장·공유폴더 등록\n소스·원장·생성파일: '+t('inventory')+'\nSHARED_INBOX·Manifest·해시·재조회: '+t('receipt')+'\n등록과 실제 수신·발송은 별도',
 '⑥ 백업·복원 및 복구시점\n'+t('backup'),
 '⑦ 검증·공식 원장·인수·사용자 승인\n'+t('verify')+'\n자체시험·독립검증·인수·사용자 승인은 별도',
 '⑧ 후속 인계 및 연결 이력\n'+t('next'),
 '⑨ 작업 종료 시 생성물 수집·공유폴더 등록\n'+t('receipt')+'\n통합 ZIP·Manifest·SHA-256·CRC·추출·재조회 개별 검증; 미확인=PASS 아님',
 '공통 제한: 기존 정상 결과 재사용, 일시 오류 최대 2회 추가 재시도, 권한·승인·해시·보안·비용 오류 즉시 HOLD, 원본 불변, 무단 서버·삭제·복원·배포 금지'].join('\n\n');}
 if(tab==='report'){renderReport();return ['PROJECT PWA — 사용자용 간략보고 V1','① 작업결과: '+t('result'),'② 다음작업: '+t('nextwork'),'③ 문제점: '+t('problem'),'④ 미처리현황: '+t('pending'),'⑤ 공용폴더 등록현황: '+t('storage')].join('\n\n');}
 if(!v('requestid'))throw Error('요청 ID를 입력하세요.');
 return ['PROJECT PWA — 공통 선택·실행승인 양식 V1','요청 ID: '+v('requestid'),'목적·실행범위: '+t('scope'),'대안·장단점: '+t('alternatives'),'선택 1: '+(v('choice')||'미접수'),'선택 2: '+(v('choice2')||'미접수'),'선택 3: '+(v('choice3')||'미접수'),'종합 의견: '+(v('opinion')||'미입력'),'제외범위·선행조건: '+t('excluded'),'비용·보안·복구 영향: '+t('risk'),'원본·해시·유효기간: '+t('approvalEvidence'),'최종 단계 표시: '+(v('decision')||'미승인'),'최종 실제 실행승인은 동일 대화에서 별도 접수: ① 실행 승인 · ② 보완 요청 · ③ 보류','현재 상태: 미승인·미접수(모의 출력); 실제 실행·승인·파일전송 없음'].join('\n\n');}
function renderReport(){let data={pending:[],storage:[]};try{if(v('roomjson'))data=JSON.parse(v('roomjson'))}catch(e){throw Error('④⑤ 상태 JSON 형식 오류')};const root=$('reportPreview');root.innerHTML='<strong>PROJECT PWA</strong><p>사용자용 간략 결과보고서 · 모의 입력</p>';
 const items=[['① 작업결과',t('result')],['② 다음작업',t('nextwork')],['③ 문제점',t('problem')]];
 items.forEach(([h,b])=>{const d=document.createElement('div');d.innerHTML='<hr><strong>'+safe(h)+'</strong><p>'+safe(b)+'</p>';root.appendChild(d)});
 [['④ 미처리현황',data.pending||[],'pending'],['⑤ 공용폴더 등록현황',data.storage||[],'storage']].forEach(([heading,arr,type])=>{const block=document.createElement('div');block.innerHTML='<hr><strong>'+heading+'</strong>';let byRoom={};arr.forEach(item=>{const room=String(item.room||'').trim();if(!/^\d{1,2}$/.test(room))return;let color=null;if(type==='pending'){if(item.state==='red'&&item.missingConfirmed===true)color='red';else if(item.state==='green'&&item.immediateConfirmed===true)color='green'}else if(item.created===true&&Array.isArray(item.files)&&item.files.length){const fail=item.files.some(f=>f.registered===false);const pass=item.files.every(f=>f.registered===true&&f.readback===true);color=fail?'red':pass?'green':null}if(color){const old=byRoom[room];if(!old||color==='red')byRoom[room]={color,detail:item.detail||'근거 상세 미입력'}}});Object.entries(byRoom).forEach(([room,obj])=>{const line=document.createElement('div');line.className='status-row';const btn=document.createElement('button');btn.className='pill '+obj.color;btn.textContent=room;btn.setAttribute('aria-expanded','false');const detail=document.createElement('div');detail.className='details hidden';detail.textContent=obj.detail;btn.onclick=()=>{detail.classList.toggle('hidden');btn.setAttribute('aria-expanded',String(!detail.classList.contains('hidden')))};line.append(btn,detail);block.appendChild(line)});root.appendChild(block)});}
$('generate').onclick=()=>{try{$('output').value=build();$('status').textContent='모의 문서 생성 완료 (실제 전송·승인 없음)'}catch(e){$('status').textContent=e.message}};
$('copy').onclick=async()=>{if(!$('output').value){$('status').textContent='먼저 문서를 생성하세요.';return}try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText($('output').value);$('status').textContent='자동 복사 성공 (실제 방 전달 아님)'}catch(e){$('output').focus();$('output').select();$('status').textContent='자동 복사 불가: 전체 선택됨. 길게 눌러 복사하세요.'}};
$('select').onclick=()=>{$('output').focus();$('output').select();$('status').textContent='전체 선택됨. 복사 메뉴를 누르세요.'};
</script></body></html>
