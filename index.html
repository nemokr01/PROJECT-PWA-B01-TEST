<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT PWA B01 복사 시험 V1</title><style>body{font:16px system-ui,sans-serif;max-width:680px;margin:24px auto;padding:16px;line-height:1.55}button{font:inherit;padding:12px 16px;margin:5px 4px 8px 0;border:1px solid #555;border-radius:9px;background:#f5f5f5}textarea{width:100%;box-sizing:border-box;min-height:200px;font:14px monospace;padding:12px}#status{font-weight:bold;white-space:pre-wrap}</style></head><body><h1>B01 복사·인계 시험 V1</h1><p>이 화면은 복사 기능만 시험합니다. 실제 방 전달·Library 등록·수신 성공을 의미하지 않습니다.</p><label for="payload">시험용 인계문</label><textarea id="payload" spellcheck="false">PROJECT PWA — B01 복사 시험
발신방: 0. 총괄·중앙자동화(Chat·임시)
허용 수신방: 2. 독립검증(Chat)
상태: 복사 기능 실기기 시험용 / 실제 전달 미확인</textarea><div><button id="copy" type="button">복사 시도</button><button id="select" type="button">전체 선택(수동 복사)</button></div><p id="status" role="status" aria-live="polite">시험 전</p><p>복사 실패 시 ‘전체 선택’을 누르고 선택된 글자를 길게 눌러 ‘복사’를 선택하세요. 주소창의 URL을 복사하는 버튼이 아닙니다.</p><script>const t=document.getElementById('payload'),s=document.getElementById('status');document.getElementById('copy').onclick=async()=>{try{if(!navigator.clipboard||!window.isSecureContext)throw Error('보안 컨텍스트 또는 클립보드 API 없음');await navigator.clipboard.writeText(t.value);s.textContent='클립보드 API 복사 성공 (실제 방 전달 아님)'}catch(e){t.focus();t.select();t.setSelectionRange(0,t.value.length);s.textContent='자동 복사 실패: '+e.message+'. 텍스트 전체 선택됨. 길게 눌러 수동 복사하세요.'}};document.getElementById('select').onclick=()=>{t.focus();t.select();t.setSelectionRange(0,t.value.length);s.textContent='텍스트 전체 선택됨. 길게 눌러 복사를 선택하세요.'};</script></body></html>
